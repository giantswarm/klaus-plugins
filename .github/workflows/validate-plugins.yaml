name: Validate Plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  KLAUSCTL_VERSION: "0.2.37"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'

    - name: Install klausctl
      run: |
        curl -fsSL -o /tmp/klausctl \
          "https://github.com/giantswarm/klausctl/releases/download/v${KLAUSCTL_VERSION}/klausctl-linux-amd64"
        install -D /tmp/klausctl "${HOME}/bin/klausctl"
        echo "${HOME}/bin" >> "${GITHUB_PATH}"

    - name: Validate plugin.json schemas
      run: |
        echo "Validating plugin.json files..."
        node shared/scripts/validate-schema.js

    - name: Check for command conflicts
      run: |
        echo "Checking for command name conflicts..."
        node shared/scripts/check-conflicts.js

    - name: Validate plugins
      run: |
        failed=0
        for dir in plugins/*/; do
          name=$(basename "$dir")
          if klausctl plugin validate "$dir"; then
            echo "  ${name}: ok"
          else
            echo "  ${name}: FAILED"
            failed=1
          fi
        done
        exit $failed

    - name: Dry-run push
      run: |
        failed=0
        for dir in plugins/*/; do
          name=$(basename "$dir")
          ref="gsoci.azurecr.io/giantswarm/klaus-plugins/${name}:dry-run"
          if klausctl plugin push --dry-run "$dir" "$ref"; then
            echo "  ${name}: ok"
          else
            echo "  ${name}: FAILED"
            failed=1
          fi
        done
        exit $failed
